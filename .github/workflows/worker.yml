name: worker

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job this run does
        type: choice
        options: [job-1]
        default: job-1

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      - name: Run the job-1 worker
        if: inputs.job == 'job-1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JOB_URL: ${{ secrets.JOB1_URL }}
        run: bash worker/run.sh job-1 incident-lookup

      # The repo is public: never upload out/ as it is. Seal it first.
      - name: Seal the output
        if: always()
        run: bash worker/seal.sh sealed

      - name: Keep the sealed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.job }}-sealed
          path: sealed/
          retention-days: 3
          if-no-files-found: error
